# ==============================================================================
# E'assistant — Docker Compose (dev environment)
# ==============================================================================

version: "3.11"

services:
  # --- FastAPI Bot ---
  app:
    build: .
    container_name: eassistant_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - .:/app
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # --- Celery Worker: high priority ---
  celery_high:
    build: .
    container_name: eassistant_celery_high
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A queue.app worker -Q high -c 4 --loglevel=info
    restart: unless-stopped

  # --- Celery Worker: low priority ---
  celery_low:
    build: .
    container_name: eassistant_celery_low
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A queue.app worker -Q low -c 2 --loglevel=info
    restart: unless-stopped

  # --- Celery Beat (scheduler) ---
  celery_beat:
    build: .
    container_name: eassistant_celery_beat
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A queue.app beat --loglevel=info
    restart: unless-stopped

  # --- Flower (Celery UI) ---
  flower:
    build: .
    container_name: eassistant_flower
    env_file:
      - .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A queue.app flower --port=5555
    restart: unless-stopped

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: eassistant_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_data:
